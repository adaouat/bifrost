# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/v0.75.0/schema.json
version: "1"

versioning:
  strategy: semver
  tag_prefix: "v"
  initial_version: "0.1.0"
  bump:
    mode: auto
    stay_at_v0: true

changelog:
  output: CHANGELOG.md

forges:
  - name: GitHub
    platform: github
    repository: adaouat/bifrost

release:
  notes: {}
  targets:
    - forge: GitHub
  assets:
    - "dist/bifrost_*_linux_amd64"
    - "dist/bifrost_*_linux_arm64"
    - "dist/bifrost_*_darwin_amd64"
    - "dist/bifrost_*_darwin_arm64"
    - "dist/bifrost_*_windows_amd64.exe"
    # homebrew archive — the cask's url.template points at these
    - "dist/bifrost_*_linux_amd64.tar.gz"
    - "dist/bifrost_*_linux_arm64.tar.gz"
    - "dist/bifrost_*_darwin_amd64.tar.gz"
    - "dist/bifrost_*_darwin_arm64.tar.gz"
    - "dist/checksums.txt"
    - "dist/packslip.sigstore.json"
    - "dist/*.sbom.json"
