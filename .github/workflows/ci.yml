name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + test come from forge's shared reusable workflow (ADR-0006).
  ci:
    uses: adaouat/forge/.github/workflows/go-ci.yml@5faab0423b48c929f72111e8cf61143b79f0eb71 # v0.19.7
    with:
      coverage-threshold: 20

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: Build
        run: go build ./cmd/bifrost/

  # Integration tests run the testcontainers suite (real Linux containers over
  # SSH). GitHub-hosted ubuntu runners ship with Docker, so no extra setup.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: Integration tests (Docker)
        run: go test -tags integration ./...
