name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + test come from forge's shared reusable workflow (ADR-0006).
  ci:
    uses: adaouat/forge/.github/workflows/go-ci.yml@79edf69202740f8e0af6d28e4b17d5965ee11ca9 # v0.6.0
    with:
      coverage-threshold: 20

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: Build
        run: go build ./cmd/bifrost/
      - name: Check GoReleaser config
        run: goreleaser check
