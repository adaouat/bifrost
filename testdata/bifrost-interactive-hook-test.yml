strategy: atomic
paths:
  releases_root: /var/releases
  shared_root: /var/shared
settings:
  releases_to_keep: 5
hooks:
  post_extract:
    - cmd: "touch /tmp/post_extract_ran"
    - cmd: "touch /tmp/interactive_would_run"
      interactive: true
environments:
  test:
    applications:
      app:
        paths:
          shared:
            directories:
              - var/log
            files:
              - .env
