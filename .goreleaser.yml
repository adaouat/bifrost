version: 2

project_name: bifrost

before:
  hooks:
    - go mod tidy

builds:
  - id: bifrost
    main: ./cmd/bifrost/
    binary: "bifrost_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{ .Tag }}

# Raw versioned binaries, no archive wrapper — the family-wide release model.
# Asset name = bifrost_<version>_<os>_<arch>; checksums.txt covers the executable
# users run. The explicit name_template (vs the format:binary default, which keys
# off .Binary) keeps the name single across goreleaser versions. See forge
# docs/guides/distribution.md.
archives:
  - id: default
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
